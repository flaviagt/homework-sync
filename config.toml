# homework-sync configuration. Nothing in here is secret — secrets come from
# environment variables (GitHub Actions secrets, or secrets.env locally).

[sync]
# Only create rows for items due within the last N days or later, so the first
# run doesn't import a quarter's worth of finished work. Items without a due
# date are always included.
backfill_days = 7

# Canvas appends "[COURSE_CODE]" to each event title, e.g. "[MGT016_FA26_005]".
# Map code prefixes to the name shown in the Notion "Course" column. The longest
# matching prefix wins; unmatched codes become "DEPT 123" automatically.
[courses]
DSC180 = "DSC Capstone"
DSC190 = "DSC 190"
MGT016 = "MGT 16"
CSE151B = "CSE 151B"

# Course websites with no API. `parser` names a parser in homework_sync/sites/.
[[sites]]
key = "cse151b"
course = "CSE 151B"
url = "https://sadhikamalladi.github.io/cs151b-fa26/index.html"
parser = "cse151b"

[[sites]]
key = "capstone"
course = "DSC Capstone"
url = "https://dsc-capstone.org/2026-27/"
parser = "capstone"

# Gradescope courses to export (the short code shown on each course card).
[gradescope]
courses = ["CSE151B_FA26_001", "DSC180A_FA26_001"]

# Column names in your Notion database.
[notion.properties]
title = "What"
course = "Course"
type = "Type"
due = "Due"
link = "Link"
status = "Status"
source_id = "Source ID"

[notion]
# Status given to newly created rows. Existing rows' Status is never changed.
new_status = "Not started"
